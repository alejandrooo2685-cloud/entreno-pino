<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Entreno Alex &amp; Adri</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<meta name="theme-color" content="#0C0B09">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entreno">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column (max 720px), sticky black header with a yellow band, bottom nav on phone / inline tabs on desktop.
   Pino F.S. colours: committed single dark look (black field, club yellow, crest cream). Gym = yellow, sport = cream, done = green, missed = red.
   Texture: the halftone dots of the hymn poster «Jugamos con el alma». */
:root{
  color-scheme:dark;
  --bg:#0C0B09; --surface:#171510; --surface-2:#242118; --ink:#F4ECD4; --muted:#A79F88; --line:#332F23;
  --accent:#F6C21B; --accent-ink:#0C0B09; --danger:#FF5F4E;
  --blue:#F6C21B; --amber:#EDE3C6; --green:#56C47E; --grey:#7D7663;
  --blue-soft:#2E2610; --amber-soft:#2A2720; --green-soft:#16301F; --red-soft:#3A1813;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.25);
  --dots:radial-gradient(rgba(246,194,27,.16) 1px,transparent 1.6px);
  --f-head:"Anton","Impact","Arial Narrow",sans-serif;
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;margin:0;text-wrap:balance}
.label{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.muted{color:var(--muted)}
.num{font-family:var(--f-display);font-variant-numeric:tabular-nums}

/* role screen */
.role-screen{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding-block:48px;gap:28px}
.brand{display:flex;align-items:center;gap:12px}
.plate{width:44px;height:44px;border-radius:50%;background:var(--accent);display:grid;place-items:center;box-shadow:inset 0 0 0 6px rgba(0,0,0,.12)}
.plate::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--bg)}
.brand h1{font-size:34px;line-height:1}
.role-screen p.lead{margin:0;color:var(--muted);max-width:44ch}
.roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.role-card{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow);transition:transform .12s, border-color .12s}
.role-card:hover{transform:translateY(-2px);border-color:var(--ink)}
.role-card .name{font-family:var(--f-display);font-size:40px;font-weight:700;line-height:1}
.role-card .tag{display:inline-block;align-self:flex-start;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:3px 9px;border-radius:99px}
.tag-blue{background:var(--blue-soft);color:var(--blue)}
.tag-red{background:var(--accent);color:var(--accent-ink)}

/* header */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:10px}
.who{display:flex;align-items:center;gap:8px;white-space:nowrap;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:5px 12px 5px 5px;font-weight:600;font-size:14px}
.who .dot{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:#fff;font-size:15px}
.weeknav{display:flex;align-items:center;gap:4px}
.weeknav .wk{display:flex;flex-direction:column;align-items:center;min-width:104px;line-height:1.1}
.weeknav .wk b{font-family:var(--f-display);font-size:22px}
.iconbtn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;font-size:18px;line-height:1}
.iconbtn:disabled{opacity:.35;cursor:default}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:99px}
.pill.open{background:var(--green-soft);color:var(--green)}
.pill.closed{background:var(--surface-2);color:var(--muted)}
.pill.next{background:var(--blue-soft);color:var(--blue)}

nav.tabs{display:flex;gap:4px}
nav.tabs button{flex:1;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;font-size:12px;font-weight:600;color:var(--muted);border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="true"]{color:var(--ink)}
nav.tabs button[aria-current="true"] svg{color:var(--accent)}
@media (max-width:759px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
    padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  main{padding-bottom:96px}
}
@media (min-width:760px){
  nav.tabs{padding-bottom:8px}
  nav.tabs button{flex-direction:row;justify-content:center;font-size:14px;gap:8px;padding:8px 10px}
  nav.tabs button[aria-current="true"]{background:var(--bg)}
  nav.tabs button svg{width:18px;height:18px}
  main{padding-bottom:48px}
}

main{padding-top:16px;display:flex;flex-direction:column;gap:16px}
.banner{border:1px dashed var(--amber);background:var(--amber-soft);border-radius:12px;padding:10px 14px;font-size:13px}

/* day strip */
.days{display:grid;gap:6px}
.days.d5{grid-template-columns:repeat(5,1fr)}
.days.d7{grid-template-columns:repeat(7,1fr)}
.daybtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;min-width:0}
.daybtn .d{font-family:var(--f-display);font-weight:700;font-size:20px;line-height:1}
.daybtn .s{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.daybtn .mark{width:8px;height:8px;border-radius:50%;background:var(--line)}
.daybtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.daybtn[aria-pressed="true"] .s{color:inherit;opacity:.75}
.daybtn .today{position:absolute;top:-7px;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;background:var(--accent);color:var(--accent-ink);padding:1px 5px;border-radius:5px}
.m-gym{background:var(--blue)!important}.m-sport{background:var(--amber)!important}.m-rest{background:var(--grey)!important}.m-done{background:var(--green)!important}.m-miss{background:var(--danger)!important}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card-head h2{font-size:26px;line-height:1.05}
.card-head h3{font-size:20px}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:9px 10px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.seg button[aria-pressed="true"].t-gym{color:var(--blue)}
.seg button[aria-pressed="true"].t-sport{color:var(--amber)}
.seg button[aria-pressed="true"].t-rest{color:var(--muted)}
.seg button[aria-pressed="true"].t-ok{color:var(--green)}
.seg button[aria-pressed="true"].t-no{color:var(--danger)}

.field{display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.input,select.input,textarea.input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-width:0}
textarea.input{resize:vertical;min-height:84px}
.input:focus{outline:none;border-color:var(--blue);background:var(--surface)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row > .field{flex:1 1 140px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.danger{color:var(--danger)}
.btn.small{padding:6px 10px;font-size:13px;border-radius:9px}
.btn:disabled{opacity:.45;cursor:default}

/* exercise rows */
.exlist{display:flex;flex-direction:column;gap:10px;counter-reset:ex}
.ex{border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:auto 1fr auto;gap:10px 12px;align-items:start;background:var(--bg)}
.ex .n{font-family:var(--f-display);font-weight:700;font-size:22px;color:var(--muted);width:24px;text-align:center;line-height:1.2}
.ex .body{min-width:0;display:flex;flex-direction:column;gap:8px}
.ex .title{font-weight:700;font-size:16px;line-height:1.25}
.chiptag{display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;color:var(--blue);background:var(--blue-soft);padding:2px 8px;border-radius:99px}
.chiptag .sub{color:var(--muted);font-weight:500}
.sr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sr .input{width:72px;text-align:center;padding:8px 6px;font-family:var(--f-display);font-size:18px;font-weight:600}
.sr .x{font-family:var(--f-display);font-size:18px;color:var(--muted)}
.ex .tools{display:flex;flex-direction:column;gap:4px}
.ex .tools .iconbtn{width:32px;height:32px;font-size:15px}
.big-sr{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1}
.big-sr small{font-size:14px;color:var(--muted);font-weight:600;margin-left:3px}
.coachnote{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:8px}
.check{width:34px;height:34px;border-radius:10px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;font-size:18px;font-weight:700}
.check[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.ex.done{background:var(--green-soft);border-color:transparent}
.ex.done .title{text-decoration:line-through;text-decoration-color:var(--green)}
.kg{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.kg .input{width:84px;padding:6px 8px}
.statusline{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600}
.badge-ok{color:var(--green)}.badge-no{color:var(--danger)}

.empty{border:1px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-size:16px}

.hero-type{display:flex;gap:14px;align-items:center;border-radius:14px;padding:16px}
.hero-type .big{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1}
.hero-type.sport{background:var(--amber-soft)} .hero-type.sport .big{color:var(--amber)}
.hero-type.rest{background:var(--surface-2)}
.disc{width:46px;height:46px;flex:none;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 7px rgba(0,0,0,.12)}
.disc::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--surface)}
.disc.sport{background:var(--amber)}.disc.rest{background:var(--grey)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.x{padding-right:6px;display:inline-flex;align-items:center;gap:6px}
.chip.x span.del{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);font-size:12px;color:var(--muted)}

/* meals */
.meal{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.meal.skipped{background:var(--surface-2)}
.meal-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.meal-head h3{font-size:21px}
.meal .seg{min-width:190px}
.meal .seg button{padding:6px 10px;font-size:13px}
.readval{display:grid;grid-template-columns:70px 1fr;gap:4px 10px;font-size:14px}
.readval dt{color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;padding-top:2px}
.readval dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sugs{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.sug{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:5px 9px;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug:hover{border-color:var(--blue);color:var(--blue)}
.extras{display:flex;flex-direction:column;gap:6px}
.extra{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px}
.extra .t{font-family:var(--f-display);font-size:17px;font-weight:600;width:46px;flex:none;font-variant-numeric:tabular-nums}
.extra .c{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);background:var(--blue-soft);padding:2px 7px;border-radius:99px;flex:none}
.extra .x{flex:1;min-width:0;overflow-wrap:anywhere}

/* week */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.stat{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg)}
.stat .v{font-family:var(--f-display);font-size:34px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.stat .v small{font-size:18px;color:var(--muted)}
.stat .k{font-size:12px;color:var(--muted);font-weight:600;margin-top:4px}
.bar{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.tablewrap{overflow-x:auto}
table.wk{width:100%;border-collapse:collapse;font-size:13px;min-width:460px}
table.wk th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line)}
table.wk td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.wk td:first-child{font-family:var(--f-display);font-weight:700;font-size:16px;width:44px}
.mdots{display:flex;gap:3px}
.mdots i{width:10px;height:10px;border-radius:3px;background:var(--surface-2)}
.mdots i.ok{background:var(--green)}.mdots i.no{background:var(--danger)}
.review{border-radius:14px;padding:14px;background:var(--bg);border:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.review p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.score{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1}
.score small{font-size:15px;color:var(--muted)}
.hist{display:flex;flex-direction:column;gap:6px}
.histrow{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.histrow b{font-family:var(--f-display);font-size:19px;min-width:96px}
.histrow .meta{flex:1;font-size:13px;color:var(--muted);min-width:0}
.histrow[aria-current="true"]{border-color:var(--ink)}

/* library */
.libgroup{display:flex;flex-direction:column;gap:6px}
.libitem{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px}
.libitem .nm{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.libitem .nm .chiptag{margin-left:6px}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:760px){.modal-bg{align-items:center}}
.modal{background:var(--surface);width:100%;max-width:620px;max-height:88%;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden;
  padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:760px){.modal{border-radius:20px}}
.modal-head{padding:16px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.modal-body{padding:12px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.pick{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;text-align:left;width:100%}
.pick .nm{flex:1;min-width:0;font-weight:600}
.pick .plus{width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:18px;flex:none}
.newform{border:1px dashed var(--blue);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;background:var(--blue-soft)}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
@media (min-width:760px){.toast{bottom:28px}}
.loading{padding-block:80px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* v2: admin exercise editor, per-set rows, sessions, maxes, media */
.worktag{display:inline-flex;font-size:12px;font-weight:600;color:var(--amber);background:var(--amber-soft);padding:2px 8px;border-radius:99px}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.exa{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--bg);display:flex;flex-direction:column;gap:10px}
.exa.done{border-color:var(--green)}
.exa-head{display:flex;align-items:flex-start;gap:8px}
.exa-head .num{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--muted);width:22px;flex:none;line-height:1.25}
.exa-head .tt{flex:1;min-width:0}
.exa-head .iconbtn{width:32px;height:32px;font-size:15px;flex:none}
.maxbox{display:flex;flex-direction:column;gap:2px;justify-content:flex-end;padding-bottom:4px}
.maxbox b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.maxbox b.none{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500}
.sets{display:flex;flex-direction:column;gap:6px}
.set-row,.sets-h{display:grid;grid-template-columns:22px minmax(0,1fr) minmax(0,1fr) 84px 32px;gap:6px;align-items:center}
.sets-h span{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.set-row .sn{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--muted);text-align:center}

const dest=path=>path.startsWith('@shared/')?{p_app:'shared',p_path:path.slice(8)}:{p_app:CFG.app,p_path:path};
const Store={
  mode:'loading', q:{}, wasDown:false, subbed:false,
  async init(){
    state.assets=AssetShim;
    if(!sb){state.auth='config';render();return}
    const {data}=await sb.auth.getSession();
    if(!data||!data.session){state.auth='out';render();return}
    const em=((data.session.user||{}).email||'').toLowerCase();
    if(em.startsWith('adri@')){state.coach=true;state.role='admin'}
    else if(em===CFG.email){state.coach=false;state.role='alumno'}
    else{await sb.auth.signOut();state.auth='out';state.wrongAcc=true;render();return}
    state.auth='in';this.mode='db';render();
    await this.load();this.sub();
  },
  apply(path,d,w){
    if(path.startsWith('weeks/'))(w||state.weeks)[path.slice(6)]=d;
    else{state.docs[path]=d;state.exists[path]=true;state.loaded[path]=true}
  },
  async load(){
    const {data,error}=await sb.from('docs').select('app,path,data').in('app',[CFG.app,'shared']);
    if(error){this.fail();return}
    const w={};(data||[]).forEach(r=>this.apply(r.app==='shared'?'@shared/'+r.path:r.path,r.data,w));
    DOCS.forEach(p=>{state.loaded[p]=true;if(!(p in state.docs)){state.docs[p]=null;state.exists[p]=false}});
    state.weeks=w;state.ready=true;onData();
  },
  sub(){
    if(this.subbed)return;this.subbed=true;
    sb.channel('docs-'+CFG.app)
      .on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'app=eq.'+CFG.app},pl=>{
        const r=pl.new;if(r&&r.path){this.apply(r.path,r.data);onData()}})
      .on('postgres_changes',{event:'*',schema:'public',table:'docs',filter:'app=eq.shared'},pl=>{
        const r=pl.new;if(r&&r.path){this.apply('@shared/'+r.path,r.data);onData()}})
      .subscribe(st=>{
        if(st==='SUBSCRIBED'&&this.wasDown){this.wasDown=false;this.load()}
        if(st==='CHANNEL_ERROR'||st==='TIMED_OUT'||st==='CLOSED')this.wasDown=true;
      });
    document.addEventListener('visibilitychange',()=>{if(!document.hidden&&state.auth==='in')this.load()});
  },
  fail(){toast('No se pudo conectar con los datos. Revisa tu conexión y recarga.')},
  enqueue(key,fn){const p=(this.q[key]||Promise.resolve()).then(fn).catch(e=>{
      if(e&&/JWT|auth|permission|Sin permiso/i.test(e.message||''))toast('Tu sesión ha caducado. Vuelve a entrar.');
      else toast('No se pudo guardar. Revisa tu conexión e inténtalo de nuevo.');});this.q[key]=p;return p},
  set(path,data){
    state.exists[path]=true;this.apply(path,clone(data));onData();
    return this.enqueue(path,async()=>{const {error}=await sb.rpc('set_doc',{...dest(path),p_data:data});if(error)throw error});
  },
  update(path,patch){
    const cur=path.startsWith('weeks/')?state.weeks[path.slice(6)]:state.docs[path];
    this.apply(path,deepMerge(clone(cur)||{},clone(patch)));onData();
    return this.enqueue(path,async()=>{const {error}=await sb.rpc('merge_doc',{...dest(path),p_patch:patch});if(error)throw error});
  }
};

function setupCmp(){

    const p=document.getElementById('cmp-pos');if(p&&n>1)p.textContent=`${i+1} de ${n} · desliza para cambiar`;
    document.querySelectorAll('.cmp-ar').forEach(x=>{x.disabled=(+x.dataset.d<0)?i<=0:i>=n-1})};
  const go=()=>{sc.scrollLeft=(state.cmp.i|0)*sc.clientWidth};go();requestAnimationFrame(go);
  let t=null;sc.addEventListener('scroll',()=>{clearTimeout(t);t=setTimeout(()=>upd(Math.round(sc.scrollLeft/Math.max(1,sc.clientWidth))),60)},{passive:true});

function leftoverSrc(dk,mk,food){
  const f=norm(food);if(!f)return null;const w=curWeek();const di=dayIdx(dk),mi=MEALS.findIndex(x=>x.k===mk);
  for(let i=di;i>=0;i--){const m=dayMeals(w,DAYS[i].k);
    for(let j=(i===di?mi-1:MEALS.length-1);j>=0;j--){const e=m[MEALS[j].k]||{};if(e.status!=='no'&&norm(e.food)===f)return `${DAYS[i].n.toLowerCase()} (${MEALS[j].n.toLowerCase()})`}}
  return null;
}

/* exercises inside a day or a session: {uid, exId, name, group, work, series:[{reps,load,unit}], note} */
function normEx(e){
  const lib=findEx(e.exId)||{};
  let series;
  if(Array.isArray(e.series))series=e.series.map(s=>({reps:String(s.reps??''),load:String(s.load??''),unit:s.unit==='pct'?'pct':'kg'}));
  else{const n=Math.max(1,Math.min(12,parseInt(e.sets)||3));series=Array.from({length:n},()=>({reps:String(e.reps??'10'),load:'',unit:'kg'}))}
  return {uid:e.uid||uid(),exId:e.exId||'',name:lib.name||e.name||'Ejercicio',group:lib.group||e.group||'',work:e.work!=null?e.work:(lib.work||''),series,note:e.note||'',ar:!!e.ar,arNote:e.arNote||'',nw:e.nw!=null?!!e.nw:!!lib.nw};
}
function getList(ctx){
  if(ctx==='sess'){const s=sessions().find(x=>x.id===state.editSess);return s?(s.exercises||[]).map(normEx):[]}
  const p=dayPlan(curWeek(),DAYS[state.gymDay].k);return (Array.isArray(p.exercises)?p.exercises:[]).map(normEx);
}
function saveList(ctx,list){
  if(ctx==='sess')return saveSessions(sessions().map(s=>s.id===state.editSess?{...s,exercises:list}:s));
  return patchWeek({days:{[DAYS[state.gymDay].k]:{type:'gym',exercises:list}}});
}
function mutateEx(ctx,u,fn){const list=getList(ctx);const e=list.find(x=>x.uid===u);if(!e)return;fn(e,list);saveList(ctx,list)}
function setKg(s,exId){
  if(s.unit!=='pct')return num(s.load);
  const m=maxFor(exId),p=num(s.load);if(m==null||p==null)return null;
  return Math.round(m*p/100*2)/2;
}
function newEx(ex){return normEx({uid:uid(),exId:ex.id,nw:!!ex.nw,name:ex.name,group:ex.group,work:ex.work||'',series:[1,2,3].map(()=>({reps:'10',load:'',unit:'kg'})),note:''})}

function pendingBanner(){

            const load=e.nw?'':s.unit==='pct'?(num(s.load)!=null?`${kg!=null?`<b>${fmtKg(kg)}</b> `:''}<span class="pc">${esc(s.load)}% de tu máx${mx?'':' (pon tu máximo en Máximos)'}</span>`:'')
              :(num(s.load)!=null?`<b>${fmtKg(num(s.load))}</b>`:(s.load?`<b>${esc(s.load)}</b>`:''));
            return `<li><span class="sn">${j+1}</span><span><b>${esc(s.reps||'–')}</b> reps</span>${load?`<span>${load}</span>`:''}</li>`}).join('')}</ol>
          ${e.note?`<div class="coachnote">${esc(e.note)}</div>`:''}

          ${e.nw?`<span class="bwtag">Peso corporal · solo repeticiones</span>`:`<label class="kg" for="kg-${e.uid}">Peso usado <input class="input" id="kg-${e.uid}" data-f="prog-kg" data-uid="${e.uid}" inputmode="decimal" value="${esc((g.kg&&g.kg[e.uid])||'')}" placeholder="kg"></label>`}
          ${videosHTML(vids,true,`data-kind="video" data-uid="${e.uid}"`)}

        </div><span class="n">${i+1}</span></div>`}).join('')}</div>`;
  }
  html+=`<div class="field"><span class="label">¿Cómo fue?</span><div class="seg">
      <button class="t-ok" data-act="prog-status" data-v="hecho" aria-pressed="${g.status==='hecho'}">✓ Hecho</button>

      <input class="input" id="prog-note" data-f="prog-note" value="${esc(g.note||'')}" placeholder="Ej: Me costó la última serie, subí peso en jalón…"></div>`;
  return html;
}

  const ex=(Array.isArray(m.extras)?m.extras:[]).length;
  return [n===4?'m-done':n>0?'m-gym':'', `${n}/4${ex?' +'+ex:''}`];
}

    ${weighCardHTML(w,d.k)}

       ${!admin?`<button class="iconbtn" data-act="extra-del" data-id="${e.id}" aria-label="Borrar" style="color:var(--danger)">${state.confirm==='xdel-'+e.id?'?':'×'}</button>`:''}</div>`).join('')}</div>`

function mealHTML(dk,x,e,admin){
  const skipped=e.status==='no';const photos=Array.isArray(e.photos)?e.photos:[];
  if(admin){
    let body;
    if(skipped)body=`<span class="badge-no statusline">No comió</span>`;
    else if(e.food||e.drink||e.dessert||photos.length)body=`<dl class="readval"><dt>Comida</dt><dd>${esc(e.food||'—')}${e.leftover&&leftoverSrc(dk,x.k,e.food)?` <span class="lotag">Sobras del ${esc(leftoverSrc(dk,x.k,e.food))}</span>`:''}</dd><dt>Bebida</dt><dd>${e.noDrink?'Nada':esc(e.drink||'—')}</dd>${x.k==='almuerzo'||x.k==='cena'?`<dt>Postre</dt><dd>${e.dessert?esc(e.dessertText||'Sí'):'No'}</dd>`:''}</dl>${photos.length?photosHTML(photos,false,'',''):''}`;
    else body=`<span class="muted">Sin apuntar</span>`;
    return `<div class="meal ${skipped?'skipped':''}"><div class="meal-head"><h3>${x.n}</h3></div>${body}</div>`;
  }
  const fid=`food-${dk}-${x.k}`,did=`drink-${dk}-${x.k}`;const upKey=`ph-${dk}-${x.k}`;
  return `<div class="meal ${skipped?'skipped':''}">
    <div class="meal-head"><h3>${x.n}</h3>
      <div class="seg"><button class="t-ok" data-act="meal-status" data-meal="${x.k}" data-v="comi" aria-pressed="${!skipped&&!!(e.food||e.drink||photos.length||e.status==='comi')}">Comí</button>
      <button class="t-no" data-act="meal-status" data-meal="${x.k}" data-v="no" aria-pressed="${skipped}">No comí</button></div></div>
    ${skipped?`<span class="muted">Apuntado como no comido.</span>`:`
    <div class="field"><label class="label" for="${fid}">Comida</label>
      <input class="input" id="${fid}" data-f="meal-food" data-meal="${x.k}" data-sug="foods" value="${esc(e.food||'')}" placeholder="Ej: Tostadas con tomate y pavo" autocomplete="off"><div class="sugs" id="sug-${fid}"></div>
      ${(()=>{const src=leftoverSrc(dk,x.k,e.food);return src?`<label class="lefto" for="lo-${dk}-${x.k}"><input type="checkbox" id="lo-${dk}-${x.k}" data-f="meal-left" data-meal="${x.k}" ${e.leftover?'checked':''}><span>Son sobras del ${esc(src)}</span></label>`:''})()}</div>
    ${e.noDrink?'':`<div class="field"><label class="label" for="${did}">Bebida</label>
      <input class="input" id="${did}" data-f="meal-drink" data-meal="${x.k}" data-sug="drinks" value="${esc(e.drink||'')}" placeholder="Ej: Café con leche, agua" autocomplete="off"><div class="sugs" id="sug-${did}"></div></div>`}
    ${x.k==='desayuno'||x.k==='merienda'?`<label class="lefto" for="nd-${dk}-${x.k}"><input type="checkbox" id="nd-${dk}-${x.k}" data-f="meal-nodrink" data-meal="${x.k}" ${e.noDrink?'checked':''}><span>No he bebido nada</span></label>`:''}
    ${x.k==='almuerzo'||x.k==='cena'?`<label class="lefto" for="ds-${dk}-${x.k}"><input type="checkbox" id="ds-${dk}-${x.k}" data-f="meal-dessert" data-meal="${x.k}" ${e.dessert?'checked':''}><span>He tomado postre</span></label>
      ${e.dessert?`<div class="field"><label class="label" for="dt-${dk}-${x.k}">¿Qué postre?</label><input class="input" id="dt-${dk}-${x.k}" data-f="meal-dessert-text" data-meal="${x.k}" data-sug="desserts" value="${esc(e.dessertText||'')}" placeholder="Ej: Natillas, fruta, helado…" autocomplete="off"><div class="sugs" id="sug-dt-${dk}-${x.k}"></div></div>`:''}`:''}
    ${state.assets||photos.length?photosHTML(photos,!!state.assets,`data-kind="photo" data-meal="${x.k}"`,state.assets?`data-act="up-photo" data-meal="${x.k}" data-key="${upKey}"`:''):''}`}
  </div>`;
}

function weekView(w){

  const pct=s.planned?Math.round(s.done/s.planned*100):0;
  const catTxt=Object.entries(s.byCat).map(([k,v])=>`${v} ${k.toLowerCase()}`).join(', ');
  const rows=DAYS.map((d,i)=>{const p=dayPlan(w,d.k),g=dayProg(w,d.k),m=dayMeals(w,d.k);
    let gym='—';
    {if(p.type==='gym')gym=esc(p.title||'Gym')+(g.status==='hecho'?' <span class="badge-ok">✓</span>':g.status==='no_fui'?' <span class="badge-no">✗ no fue</span>':'');
      else if(p.type==='sport')gym=esc(p.sport==='Otro'?(p.sportOther||'Deporte'):(p.sport||'Deporte'))+' · '+fmtDur(p.h??1,p.m??0);
      else if(p.type==='rest')gym='<span class="muted">Libre</span>';}
    const xa=xaList(w).filter(a=>a.day===d.k);if(xa.length)gym=(gym==='—'?'':gym+'<br>')+xa.map(a=>`<span class="xatag">+ ${esc(xaName(a))} ${fmtDur(a.h,a.m)}</span>`).join(' ');
    const dots=MEALS.map(x=>{const e=m[x.k]||{};return `<i class="${e.status==='no'?'no':(e.food||e.drink||(e.photos&&e.photos.length))?'ok':''}" title="${x.n}"></i>`}).join('');
    const ex=(Array.isArray(m.extras)?m.extras:[]).map(e=>esc(e.text)).join(', ');
    return `<tr><td>${d.s}</td><td>${gym}</td><td><div class="mdots">${dots}</div></td><td>${ex||'<span class="muted">—</span>'}</td></tr>`}).join('');

    review=`<div class="card"><img class="lema review-lema" src="img/himno-lema.jpg" alt="Jugamos con el alma"><div class="card-head"><div><div class="label">Semana ${w.num} cerrada</div><h3>Valoración de Adri</h3></div>
      ${admin?`<div class="row"><button class="btn small" data-act="edit-review">Editar</button><button class="btn small" data-act="reopen">${state.confirm==='reopen'?'Toca otra vez':'Reabrir semana'}</button></div>`:''}</div>
      <div class="review"><div class="row" style="justify-content:space-between;align-items:center"><span class="label">Gimnasio</span>${r0.gymScore?`<span class="score">${esc(r0.gymScore)}<small>/10</small></span>`:''}</div><p>${esc(r0.gym||'Sin comentario.')}</p></div>
      <div class="review"><div class="row" style="justify-content:space-between;align-items:center"><span class="label">Comida</span>${r0.foodScore?`<span class="score">${esc(r0.foodScore)}<small>/10</small></span>`:''}</div><p>${esc(r0.food||'Sin comentario.')}</p></div>
      ${admin?(w.reviewRead?`<div class="statusline badge-ok">✓ Alex lo ha leído</div>`:`<div class="statusline muted">Alex todavía no lo ha leído</div>`):(w.reviewRead?`<div class="statusline badge-ok">✓ Marcado como leído</div>`:`<button class="btn primary block" data-act="review-read">✓ Lo he leído</button>`)}
    </div>`;
  }else if(admin){
    review=`<div class="card"><div class="card-head"><div><div class="label">Fin de semana</div><h3>${st==='closed'?'Editar valoración':'Cerrar la Semana '+w.num}</h3></div></div>
      <div class="field"><label class="label" for="rv-gym">Análisis del gimnasio</label><textarea class="input" id="rv-gym" data-f="rv" placeholder="Qué tal han ido los entrenos, asistencia, progresos, qué mejorar…">${esc(r.gym||'')}</textarea></div>
      <div class="field" style="max-width:160px"><label class="label" for="rv-gs">Nota gym</label><select class="input" id="rv-gs" data-f="rv">${RATINGS.map(v=>`<option value="${v}" ${String(r.gymScore||'')===v?'selected':''}>${v?v+' / 10':'Sin nota'}</option>`).join('')}</select></div>
      <div class="field"><label class="label" for="rv-food">Análisis de la comida</label><textarea class="input" id="rv-food" data-f="rv" placeholder="Comidas saltadas, extras, qué cambiar la semana que viene…">${esc(r.food||'')}</textarea></div>
      <div class="field" style="max-width:160px"><label class="label" for="rv-fs">Nota comida</label><select class="input" id="rv-fs" data-f="rv">${RATINGS.map(v=>`<option value="${v}" ${String(r.foodScore||'')===v?'selected':''}>${v?v+' / 10':'Sin nota'}</option>`).join('')}</select></div>
      ${st==='closed'?`<div class="row"><button class="btn primary" data-act="save-review">Guardar valoración</button><button class="btn ghost" data-act="cancel-review">Cancelar</button></div>`
        :`<button class="btn block" data-act="save-draft">Guardar sin cerrar</button>
          <button class="btn accent block" data-act="close-week">${state.confirm==='close'?'¿Seguro? Toca otra vez para cerrar':'Cerrar semana y enviar valoración'}</button>
          <span class="muted" style="font-size:13px">Al cerrarla, Alex verá tu valoración y pasaréis a la Semana ${w.num+1} (se crea si no existe).</span>`}
    </div>`;
  }else{
    review=`<div class="card"><div class="empty"><b>Valoración pendiente</b><span>Cuando Adri cierre la semana, verás aquí su análisis del gimnasio y de la comida.</span></div></div>`;
  }
  const l=weekList();
  return `
  <div class="card">
    <div class="card-head"><div><div class="label">Resumen</div><h2>Semana ${w.num}</h2></div><span class="pill ${st}">${statusLabel[st]}</span></div>

      <div class="stat"><div class="v">${s.logged}<small>/28</small></div><div class="k">Comidas apuntadas${s.skipped?` · ${s.skipped} sin comer`:''}${s.photos?` · ${s.photos} fotos`:''}</div></div>
      <div class="stat"><div class="v">${s.extras}</div><div class="k">Extras${catTxt?' · '+esc(catTxt):''}</div></div>
    </div>
    <div class="tablewrap"><table class="wk"><thead><tr><th>Día</th><th>Entreno</th><th>Comidas</th><th>Extras</th></tr></thead><tbody>${rows}</tbody></table></div>
  </div>
  ${weightCard()}
  ${bodyCard()}
  ${review}
  <div class="card"><div class="card-head"><div><div class="label">Historial</div><h3>Todas las semanas</h3></div></div>
    <div class="hist">${[...l].reverse().map(x=>{const ss=weekStats(x);const xs=weekStatus(x);
      return `<button class="histrow" data-act="week-go" data-id="${x.id}" aria-current="${x.id===state.weekId}"><b>Semana ${x.num}</b><span class="meta">${ss.done}/${ss.planned} entrenos · ${ss.logged}/28 comidas · ${ss.extras} extras</span><span class="pill ${xs}">${statusLabel[xs]}</span></button>`}).join('')}</div>
  </div>`;
}

const fp=document.getElementById('filepick');
function pickFile(pending,accept){state.pending=pending;fp.accept=accept;fp.value='';fp.click()}
fp.addEventListener('change',()=>{const f=fp.files&&fp.files[0];const p=state.pending;state.pending=null;if(f&&p)handleUpload(f,p)});
async function shrinkImage(file){
  if(file.size<500*1024&&/^image\/(jpeg|png|webp)$/.test(file.type))return file;
  try{
    let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await createImageBitmap(file)}
    const sc=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));if(b)return b;
  }catch(e){}
  if(/^image\/(jpeg|png|webp|gif)$/.test(file.type))return file;
  throw {code:'unsupported_photo'};
}
async function squareImage(file){
  try{
    let bmp;try{bmp=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){bmp=await createImageBitmap(file)}
    const side=Math.min(bmp.width,bmp.height);const c=document.createElement('canvas');c.width=c.height=400;
    c.getContext('2d').drawImage(bmp,(bmp.width-side)/2,(bmp.height-side)/2,side,side,0,0,400,400);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.85));if(b)return b;
  }catch(e){}
  throw {code:'unsupported_photo'};
}
function uploadErr(e,file){
  const c=e&&e.code;
  if(c==='unsupported_photo')return 'Ese formato de foto no se puede abrir aquí. Prueba con una foto JPG o haz una captura.';
  if(c==='mov')return 'Los vídeos .MOV no se pueden subir. Grábalo en MP4 o pásalo a MP4 antes.';
  if(c==='unsupported_type')return 'Ese tipo de archivo no se puede subir. Usa vídeo MP4 o WebM.';
  if(c==='too_large')return `El vídeo pesa ${Math.round(file.size/1048576)} MB y el máximo es 20 MB. Graba un clip más corto o en 720p.`;
  if(c==='quota_or_state')return 'No queda espacio para más archivos en la app.';
  if(c==='rate_limited')return 'Demasiadas subidas seguidas. Espera un momento y vuelve a probar.';
  if(c==='not_granted'||c==='capability_disabled'||c==='capability_removed')return 'Desde aquí no se pueden subir archivos.';
  return 'No se pudo subir el archivo. Inténtalo de nuevo.';
}
async function handleUpload(file,p){
  const A=state.assets;if(!A){toast('Desde aquí no se pueden subir archivos.');return}
  state.uploading=p.key;render();
  try{
    let data=file,type=file.type;
    if(p.kind==='avatar'){data=await squareImage(file);type='image/jpeg'}
    else if(p.kind==='body'){data=await shrinkImage(file);type=data.type||'image/jpeg'}
    else if(p.kind==='photo'){data=await shrinkImage(file);type=data.type||'image/jpeg'}
    else{
      if(!/^video\/(mp4|webm)$/.test(type)){
        if(/\.mp4$/i.test(file.name))type='video/mp4';else if(/\.webm$/i.test(file.name))type='video/webm';
        else if(/quicktime/i.test(type)||/\.mov$/i.test(file.name))throw {code:'mov'};
        else throw {code:'unsupported_type'};
      }
      if(file.size>MAX_VIDEO)throw {code:'too_large'};
    }
    let r;try{r=await A.upload(data,{type})}catch(e){if(e&&e.code==='store_unavailable'){await new Promise(x=>setTimeout(x,1200));r=await A.upload(data,{type})}else throw e}
    const item={id:r.id,at:Date.now()};const w=state.weeks[p.week];
    if(p.kind==='body'){const list=Array.isArray(BD().entries)?clone(BD().entries):[];let e=list.find(x=>x.week===p.weekNum&&x.day===p.day);
      if(!e){e={id:uid(),week:p.weekNum,day:p.day,at:Date.now(),analysis:''};list.push(e)}const old=e[p.slot];e[p.slot]=r.id;e.at=Date.now();
      await saveBody({entries:list});if(old&&old!==r.id)A.delete(old).catch(()=>{});toast('Foto subida');notify('admin',`📸 ${CFG.student} ha subido una foto de físico.`,'body-'+p.weekNum+p.day)}
    else if(p.kind==='avatar'){const old=(state.docs['library/profile']||{})[p.role];await Store.update('library/profile',{[p.role]:r.id});if(old&&old!==r.id)A.delete(old).catch(()=>{});toast('Foto de perfil cambiada')}
    else if(p.kind==='photo'){const cur=((dayMeals(w,p.day)[p.meal])||{}).photos||[];await Store.update('weeks/'+p.week,{meals:{[p.day]:{[p.meal]:{photos:[...cur,item],status:'comi'}}}});toast('Foto subida');notify('admin',`📷 ${CFG.student} ha subido una foto de ${MEAL_N[p.meal]} del ${dayName(p.day)}.`,'mp-'+p.week+p.day+p.meal)}
    else{const cur=((dayProg(w,p.day).videos)||{})[p.uid]||[];await Store.update('weeks/'+p.week,{progress:{[p.day]:{videos:{[p.uid]:[...cur,item]}}}});toast('Vídeo subido')}
  }catch(e){toast(uploadErr(e,file))}
  state.uploading=null;render();
}

document.addEventListener('change',ev=>{
  const el=ev.target;if(el.id==='xa-h')state.xa.h=+el.value;if(el.id==='xa-m')state.xa.m=+el.value;const f=el.dataset&&el.dataset.f;if(!f)return;
  try{hookChange(f,el)}catch(e){}
  if(f==='rv'){keepRv(el);return}
const v=el.value;
  const gk=DAYS[state.gymDay].k, fk=DAYS[state.foodDay].k;const ctx=el.dataset.ctx;
  switch(f){
    case'day-title':patchWeek({days:{[gk]:{title:v.trim()}}});break;
    case'day-reason':patchWeek({days:{[gk]:{reason:v.trim()}}});break;
    case'sport-other':patchWeek({days:{[gk]:{sportOther:v.trim()}}});break;
    case'sport-h':patchWeek({days:{[gk]:{h:+v}}});break;
    case'sport-m':patchWeek({days:{[gk]:{m:+v}}});break;
    case'set-reps':case'set-load':case'set-unit':mutateEx(ctx,el.dataset.uid,e=>{const s=e.series[+el.dataset.i];if(s)s[f==='set-reps'?'reps':f==='set-load'?'load':'unit']=v.trim().replace(/%$/,'')});break;
    case'ex-work':mutateEx(ctx,el.dataset.uid,e=>{e.work=v});break;
    case'ex-note':mutateEx(ctx,el.dataset.uid,e=>{e.note=v.trim()});break;
    case'ex-ar-note':mutateEx(ctx,el.dataset.uid,e=>{e.arNote=v.trim()});break;
    case'sess-name':{const name=v.trim();if(name)saveSessions(sessions().map(s=>s.id===state.editSess?{...s,name}:s));break}
    case'max-kg':{const id=el.dataset.id;const kg=num(v);const old=maxes()[id]||{};const hist=Array.isArray(old.hist)?[...old.hist]:[];
      if(kg===num(old.kg))break;
      if(num(old.kg)!=null)hist.unshift({kg:old.kg,week:old.week||null});
      const cw=state.weeks['w'+curNum()]||weekList().find(x=>x.status!=='cerrada');
      Store.update('library/maxes',{byEx:{[id]:{kg:kg==null?null:String(kg),week:cw?cw.num:null,hist:hist.slice(0,10)}}});toast(kg==null?'Máximo borrado':'Máximo guardado');break}
    case'prog-kg':{patchWeek({progress:{[gk]:{kg:{[el.dataset.uid]:v.trim()}}}});
      const ex=getList('day').find(x=>x.uid===el.dataset.uid);const kg=num(v);const mx=ex&&ex.exId?maxFor(ex.exId):null;
      if(ex&&ex.exId&&kg!=null&&kg>0&&(mx==null||kg>mx)){const old=maxes()[ex.exId]||{};const hist=Array.isArray(old.hist)?[...old.hist]:[];
        if(mx!=null)hist.unshift({kg:old.kg,week:old.week||null});const cw=curWeek();
        Store.update('library/maxes',{byEx:{[ex.exId]:{kg:String(kg),week:cw?cw.num:null,hist:hist.slice(0,10)}}});
        notify('admin',`🏆 ${CFG.student}: ${mx==null?'primer máximo':'nuevo máximo'} en ${ex.name}: ${fmtKg(kg)}.`);
        toast(mx==null?`Primer máximo en ${ex.name}: ${fmtKg(kg)}`:`¡Nuevo máximo en ${ex.name}! ${fmtKg(mx)} → ${fmtKg(kg)}`)}
      break}
    case'prog-note':patchWeek({progress:{[gk]:{note:v.trim()}}});break;
    case'xa-h':case'xa-m':break;
    case'meal-dessert':patchWeek({meals:{[fk]:{[el.dataset.meal]:{dessert:el.checked,status:'comi'}}}});break;
    case'meal-dessert-text':patchWeek({meals:{[fk]:{[el.dataset.meal]:{dessertText:v.trim()}}}});remember('desserts',v);break;
    case'meal-nodrink':patchWeek({meals:{[fk]:{[el.dataset.meal]:el.checked?{noDrink:true,drink:'',status:'comi'}:{noDrink:false}}}});break;
    case'meal-left':patchWeek({meals:{[fk]:{[el.dataset.meal]:{leftover:el.checked}}}});break;
    case'meal-food':case'meal-drink':{const key=f==='meal-food'?'food':'drink';
      patchWeek({meals:{[fk]:{[el.dataset.meal]:{[key]:v.trim(),status:'comi'}}}});remember(key==='food'?'foods':'drinks',v);break}
    case'exf-group':state.exForm.group=v;break;
    case'exf-work':state.exForm.work=v;break;
    case'extra-time':state.extraTime=v;break;
    case'extra-text':state.extraText=v;break;
  }
});

    else if(f==='exf-name')click('[data-act="exf-save"]');
    else if(f==='new-group')click('[data-act="group-add"]');
    else if(f==='new-work')click('[data-act="work-add"]');
    else if(f==='new-sess')click('[data-act="sess-new"]');
    else if(f==='weigh-in')click(`[data-act="weigh-save"][data-day="${ev.target.dataset.day}"]`);
    else if(f==='ask-kg')click('[data-act="ask-save"]');
    else if(ev.target.id==='lg-pass')click('[data-act="login"]');
    else ev.target.blur();}
});
document.addEventListener('pointerdown',ev=>{if(ev.target.closest('.sug'))ev.preventDefault()});
function showSugs(el){
  const box=document.getElementById('sug-'+el.id);if(!box)return;
  const q=norm(el.value);const src=libArr(el.dataset.sug);
  const hits=src.filter(s=>!q||(norm(s).includes(q)&&norm(s)!==q)).slice(0,6);
  box.innerHTML=hits.length?hits.map(s=>`<button class="sug" type="button" data-act="sug" data-for="${el.id}" data-val="${esc(s)}">${esc(s)}</button>`).join(''):'';
}
function hideSugs(){document.querySelectorAll('.sugs').forEach(b=>{if(!b.contains(document.activeElement)&&!(document.activeElement&&b.id==='sug-'+document.activeElement.id))b.innerHTML=''})}

render();
Store.init();
</script>
