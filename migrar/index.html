<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Migrar datos</title>
<style>
:root{color-scheme:dark}
body{margin:0;background:#0C0B09;color:#F4ECD4;font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px 16px}
main{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:0;color:#F6C21B}
label{display:flex;flex-direction:column;gap:6px;font-weight:600}
input,select,button{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid #332F23;background:#171510;color:inherit}
button{background:#F6C21B;color:#0C0B09;font-weight:700;border:0;cursor:pointer}
button:disabled{opacity:.5}
pre{background:#171510;border:1px solid #332F23;border-radius:10px;padding:12px;white-space:pre-wrap;max-height:50vh;overflow:auto;font-size:13px}
.bar{height:10px;background:#242118;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:#F6C21B}
</style></head><body><main>
<h1>Migrar datos desde Claude</h1>
<p>Sube aquí el archivo .zip que te ha preparado Claude con los datos de una app. Se puede repetir sin problema: si algo falla, vuelve a ejecutarlo.</p>
<label>App<select id="app"><option value="alex">Alex &amp; Adri</option><option value="juanma">Juanma &amp; Adri</option></select></label>
<label>Contraseña de esa app<input id="pw" type="password" autocomplete="off"></label>
<label>Archivo .zip<input id="zip" type="file" accept=".zip"></label>
<button id="go">Migrar</button>
<div class="bar"><i id="bar"></i></div>
<pre id="log">Esperando…</pre>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>
<script src="../config.js"></script>
<script>
const $=id=>document.getElementById(id);
const log=t=>{$('log').textContent+= '\n'+t;$('log').scrollTop=1e9};
$('go').onclick=async()=>{
  const app=$('app').value,pw=$('pw').value,f=$('zip').files[0];
  if(!pw||!f){alert('Falta la contraseña o el archivo.');return}
  $('go').disabled=true;$('log').textContent='Empezando…';
  try{
    const C=window.SB_CONFIG;const sb=supabase.createClient(C.url,C.key,{auth:{persistSession:false}});
    const {error:le}=await sb.auth.signInWithPassword({email:app+'@entreno.app',password:pw});
    if(le)throw new Error('No se pudo entrar: '+le.message);
    log('Sesión iniciada como '+app);
    const zip=await JSZip.loadAsync(f);
    const meta=JSON.parse(await zip.file('export.json').async('string'));
    if(meta.app!==app)throw new Error('Este zip es de la app «'+meta.app+'», no de «'+app+'».');
    const docs=meta.docs,media=meta.media;const total=docs.length+media.length;let done=0,fails=0;
    const step=()=>{done++;$('bar').style.width=(done/total*100)+'%'};
    for(const d of docs){
      const {error}=await sb.rpc('set_doc',{p_app:app,p_path:d.path,p_data:d.data});
      if(error){fails++;log('✗ '+d.path+': '+error.message)}else log('✓ '+d.path);step();
    }
    for(const m of media){
      const file=zip.file('media/'+m.id);
      if(!file){fails++;log('✗ falta '+m.id);step();continue}
      const blob=new Blob([await file.async('uint8array')],{type:m.type});
      const {error}=await sb.storage.from('media').upload(app+'/'+m.id,blob,{contentType:m.type,upsert:true});
      if(error){fails++;log('✗ '+m.id+': '+error.message)}else log('✓ archivo '+m.id+' ('+Math.round(blob.size/1024)+' KB)');step();
    }
    log(fails?`\nTerminado con ${fails} errores. Vuelve a pulsar «Migrar» para reintentar.`:`\n✅ Listo: ${docs.length} bloques de datos y ${media.length} fotos/vídeos migrados.`);
  }catch(e){log('\n✗ '+(e.message||e))}
  $('go').disabled=false;
};
</script>
</body></html>
